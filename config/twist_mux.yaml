# twist_mux: picks one velocity command source and forwards it to the robot.
# Higher priority wins; a source is ignored once it has been silent for `timeout` seconds.
# Output topic is remapped on the command line to /diff_cont/cmd_vel_unstamped (Foxy: unstamped Twist).
#   navigation: Nav2 publishes /cmd_vel
#   keyboard:   teleop_twist_keyboard remapped to /cmd_vel_key (replaces the joystick of the reference repo)
#   guard:      scripts/path_guard.py holds the robot (zero speed) while its route is blocked
#   assist:     scripts/gap_assist.py lines the robot up with a narrow gap when Nav2 is stuck (above the guard,
#               which it never overrides: it does not start while the guard holds the robot)
#   recovery:   scripts/self_recovery.py turns the robot slowly while it searches for its position
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel
        timeout : 0.5
        priority: 10
      guard:
        topic   : cmd_vel_guard
        timeout : 0.3
        priority: 40
      assist:                       # scripts/gap_assist.py lines the robot up with a narrow gap and drives through
        topic   : cmd_vel_assist
        timeout : 0.5
        priority: 45
      recovery:
        topic   : cmd_vel_recovery
        timeout : 0.5
        priority: 50
      keyboard:
        topic   : cmd_vel_key
        timeout : 0.5
        priority: 100
