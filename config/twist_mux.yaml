# twist_mux: picks one velocity command source and forwards it to the robot.
# Higher priority wins; a source is ignored once it has been silent for `timeout` seconds.
# Output topic is remapped on the command line to /diff_cont/cmd_vel_unstamped (Foxy: unstamped Twist).
#   navigation: Nav2 publishes /cmd_vel
#   keyboard:   teleop_twist_keyboard remapped to /cmd_vel_key (replaces the joystick of the reference repo)
twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel
        timeout : 0.5
        priority: 10
      keyboard:
        topic   : cmd_vel_key
        timeout : 0.5
        priority: 100
