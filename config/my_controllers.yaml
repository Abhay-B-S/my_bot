controller_manager:
  ros__parameters:
    update_rate: 30
    # use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 35.0

    base_frame_id: base_link

    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.288   # delivery body 2026-10-23, tyre centre to tyre centre (old robot 0.225)
    wheel_radius: 0.034       # 70 mm wheels; 0.034 matched a 1 m tape test under load

    use_stamped_vel: false
   
    # open_loop: false    

    # wheels_per_side: x
    # wheel_separation_multiplier: x
    wheel_separation_multiplier: 0.9   # 360 degree turn tests 2026-10-23 - real turns ~10% more than 0.288 predicts (ratios 0.88, 0.905)
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    # i have uncommented above two lines
    # odom_frame_id: x
    # pose_covariance_diagonal: x
    # twist_covariance_diagonal: x
    # open_loop: x
    # enable_odom_tf: x

    # cmd_vel_timeout: x
    # publish_limited_velocity: x
    # velocity_rolling_window_size: x
    

    # Gradual starts and stops (2026-10-23): an instant stop of the heavy robot made a current spike that
    # restarted the motor Arduino, after which the motors ran uncontrolled. Every command (keyboard, Nav2)
    # now ramps at most 0.8 m/s per second and 1.2 rad/s per second; speeds are also capped as a safety net.
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    # linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.25
    linear.x.min_velocity: -0.25
    linear.x.max_acceleration: 0.8
    linear.x.min_acceleration: -0.8
    # linear.x.max_jerk: NAN
    # linear.x.min_jerk: NAN

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    # angular.z.has_jerk_limits: false
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 1.2
    angular.z.min_acceleration: -1.2
    # angular.z.max_jerk: NAN
    # angular.z.min_jerk: NAN




