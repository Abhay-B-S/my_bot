<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Delivery Robot</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
    --accent: #1a56db; --accent-text: #ffffff; --ok: #0f7b3f; --warn: #a15c00; --bad: #b42318;
    --ok-bg: #e3f6ea; --warn-bg: #fff1d6; --bad-bg: #fde7e4; --info-bg: #e6eefc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1c212c; --text: #e8ebf2; --muted: #9aa4b8; --line: #2c3342;
      --accent: #6c9bff; --accent-text: #0b1020; --ok: #62d68f; --warn: #ffc15a; --bad: #ff8a7d;
      --ok-bg: #16301f; --warn-bg: #3a2c10; --bad-bg: #3a1a17; --info-bg: #1b2a49;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 8px 0 12px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  select, input, button { width: 100%; font: inherit; border-radius: 10px; padding: 12px; }
  select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  button { border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600;
           margin-top: 12px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.big { padding: 16px; font-size: 1.05rem; }
  button.link { background: none; color: var(--accent); width: auto; padding: 4px 8px; margin: 0; font-weight: 600; }
  .hidden { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #robot { display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
  #robotText { font-size: .92rem; }
  .muted { color: var(--muted); font-size: .85rem; }
  .req { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .req:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .route { font-weight: 600; }
  .chip { display: inline-block; font-size: .8rem; font-weight: 600; padding: 3px 10px;
          border-radius: 999px; background: var(--info-bg); margin-top: 6px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .alert { background: var(--warn-bg); color: var(--text); border-radius: 10px; padding: 10px 12px;
           margin-top: 10px; font-weight: 600; }
  .error { color: var(--bad); min-height: 1.3em; margin-top: 8px; font-size: .9rem; }
  #msg { min-height: 1.3em; margin-top: 8px; font-size: .9rem; }
  /* sound: browsers only allow sound after a tap, so a full-screen card asks for one */
  #soundGate { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
               align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #soundGate.hidden { display: none; }
  #soundGate .card { max-width: 420px; text-align: center; margin: 0; }
  #soundGate .icon { font-size: 2.6rem; }
  #soundState { margin-top: 10px; }
  /* the robot is waiting for this person: the page pulses orange (1 s cycle, gentle enough to be safe) */
  @keyframes callme { 0%, 100% { background: var(--bg); } 50% { background: #ff9f1c; } }
  body.flash { animation: callme 1s ease-in-out infinite; }
</style>
</head>
<body>
<main>
  <h1>Campus Delivery Robot</h1>

  <!-- Login: shown until someone is signed in -->
  <form id="login" class="card hidden" autocomplete="on">
    <h2>Log in</h2>
    <label for="uid">ID</label>
    <input id="uid" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Log in</button>
    <div id="loginMsg" class="error"></div>
  </form>

  <!-- The app: shown after login -->
  <div id="app" class="hidden">
    <div class="card" id="robot">
      <span class="dot" id="dot"></span>
      <div><strong id="robotName">Robot</strong><div id="robotText" class="muted">Connecting...</div></div>
    </div>

    <div class="card">
      <div class="row">
        <div><strong id="whoName"></strong><div id="whoCabin" class="muted"></div></div>
        <button id="logout" class="link" type="button">Log out</button>
      </div>
      <button id="soundState" class="link" type="button">🔔 Sound on (tap to test)</button>
      <h2 style="margin-top:16px">Send a parcel</h2>
      <label for="to">Send to</label>
      <select id="to"></select>
      <button id="send">Request delivery</button>
      <div id="msg" class="muted"></div>
    </div>

    <div class="card">
      <h2>My deliveries</h2>
      <div id="list" class="muted">Nothing yet.</div>
    </div>
  </div>

  <!-- Shown after login (and whenever the phone has muted the page) until the user taps the button -->
  <div id="soundGate" class="hidden">
    <div class="card">
      <div class="icon">🔔</div>
      <h2>Turn on sound</h2>
      <p class="muted">The robot beeps this phone when it reaches your cabin. Keep this page open and the volume up.</p>
      <button id="soundBtn" class="big" type="button">Turn on sound</button>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ---- People who can log in: login ID, name shown on screen, and the robot's map spot (cabin) ----
// "cabin" must match a name in config/locations.yaml. The same list (id -> cabin) is enforced by the
// database rules (members.json), so editing this list alone does not give anyone extra rights.
const EMAIL_DOMAIN = "@example.com";
const TEACHERS = [
  { id: "abhaybs",     name: "Abhay B S",     cabin: "cabin_A" },
  { id: "darshanraju", name: "Darshan Raju",  cabin: "cabin_B" },
  { id: "khushal",     name: "Khushal",       cabin: "cabin_C" },
  { id: "abhisheksj",  name: "Abhishek S J",  cabin: "cabin_D" },
];

// Firebase web config (identifies the project; it is not a password)
const firebaseConfig = {
  apiKey: "AIzaSyByOIQUag5MRhQiflwGldqNYPJGWaO-QTo",
  authDomain: "delivery-robot-demo.firebaseapp.com",
  databaseURL: "https://delivery-robot-demo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "delivery-robot-demo",
  storageBucket: "delivery-robot-demo.firebasestorage.app",
  messagingSenderId: "172530553636",
  appId: "1:172530553636:web:f4fb295c3830cb1d1d99b1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const STATUS = {   // status text on a request -> [what the user sees, chip colour]
  pending: ["Sending to the robot...", ""],
  queued: ["In the queue", ""],
  going_to_sender: ["Robot is on its way to the sender", ""],
  wait_shipped: ["Robot is at the sender", "warn"],
  going_to_destination: ["Robot is carrying the parcel to the receiver", ""],
  wait_received: ["Robot has arrived at the receiver", "warn"],
  delivered: ["Delivered", "ok"],
  failed: ["Delivery failed", "bad"],
  rejected: ["Request rejected", "bad"],
};

const $ = id => document.getElementById(id);
let current = null, requests = {}, robot = null, offset = 0, lastStatus = {}, unsub = [];

function cabinLabel(c) { return c.replace("_", " "); }
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function show(loggedIn) {
  $("login").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
  checkSound();
  updateFlash();
}

// ---------- login ----------
$("login").onsubmit = ev => {
  ev.preventDefault();
  // Accept a short ID ("abhaybs") or the full address ("abhaybs@example.com").
  const id = $("uid").value.trim().toLowerCase(), pw = $("pw").value;
  const email = id.includes("@") ? id : id + EMAIL_DOMAIN;
  $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
  auth.signInWithEmailAndPassword(email, pw)
    .then(() => { $("pw").value = ""; })
    .catch(e => {
      const wrong = ["auth/wrong-password", "auth/user-not-found", "auth/invalid-credential",
                     "auth/invalid-login-credentials"];
      $("loginMsg").textContent = wrong.includes(e.code) ? "Wrong ID or password."
        : e.code === "auth/invalid-email" ? "That ID does not look right. Type only your ID, for example abhaybs."
        : e.code === "auth/network-request-failed" ? "No internet connection."
        : e.code === "auth/too-many-requests" ? "Too many tries. Wait a minute and try again."
        : "Could not log in (" + e.code + ").";
    })
    .finally(() => { $("loginBtn").disabled = false; });
};
$("logout").onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  unsub.forEach(f => f()); unsub = [];
  requests = {}; robot = null; lastStatus = {};
  if (!user) { current = null; show(false); return; }
  const id = (user.email || "").replace(EMAIL_DOMAIN, "");
  current = TEACHERS.find(t => t.id === id) || null;
  if (!current) {                                  // e.g. the robot's account on the page
    show(false); $("loginMsg").textContent = "This account cannot use the page."; auth.signOut(); return;
  }
  show(true);
  $("whoName").textContent = current.name;
  $("whoCabin").textContent = "Cabin " + cabinLabel(current.cabin).replace("cabin ", "");
  const others = TEACHERS.filter(t => t.id !== current.id);
  $("to").innerHTML = "";
  others.forEach((t, i) => {
    const o = el("option", "", t.name + " (" + cabinLabel(t.cabin) + ")"); o.value = i; $("to").appendChild(o);
  });
  $("to")._items = others;
  listen(db.ref("robot"), s => { robot = s.val(); renderRobot(); });
  listen(db.ref("requests").limitToLast(50), s => { requests = s.val() || {}; render(); });
});

function listen(ref, cb) {
  const wrapped = s => cb(s);
  ref.on("value", wrapped, err => { $("msg").textContent = "Cannot read data: " + err.message; });
  unsub.push(() => ref.off("value", wrapped));
}

// ---------- actions ----------
$("send").onclick = () => {
  const to = $("to")._items[+$("to").value], btn = $("send");
  btn.disabled = true;
  db.ref("requests").push({
    sender: current.cabin, destination: to.cabin,
    senderName: current.name, receiverName: to.name,
    status: "pending", detail: "", created: firebase.database.ServerValue.TIMESTAMP
  }).then(() => { $("msg").textContent = "Request sent."; })
    .catch(e => { $("msg").textContent = "Could not send: " + e.message; })
    .finally(() => { setTimeout(() => { btn.disabled = false; $("msg").textContent = ""; }, 2500); });
};

function press(id, field) {
  db.ref("requests/" + id + "/" + field).set(true)
    .catch(e => { $("msg").textContent = "Could not send: " + e.message; });
}

// ---------- sound ----------
// Browsers start a page muted: sound only works after the user has tapped something. One audio
// "context" is unlocked by the tap on the Turn on sound card and then reused for every beep.
let audio = null, wakeLock = null;

function soundOn() { return audio && audio.state === "running"; }

function checkSound() {        // show the card while someone is logged in and the sound is locked
  const need = !!current && !soundOn();
  $("soundGate").classList.toggle("hidden", !need);
  $("soundState").textContent = soundOn() ? "🔔 Sound on (tap to test)" : "🔕 Sound off (tap to turn on)";
}

function unlockSound() {       // must run inside a tap
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    audio.resume().then(() => { beep("test"); checkSound(); });
  } catch (e) {}
  keepAwake();
  checkSound();
}
$("soundBtn").onclick = unlockSound;
$("soundState").onclick = () => soundOn() ? beep("test") : unlockSound();

// a beep pattern: "arrive" = three high beeps, "done" = two rising tones, "test" = one short beep
function beep(kind) {
  const pattern = { arrive: [[988, 0], [988, .3], [988, .6]], done: [[660, 0], [880, .25]], test: [[880, 0]] }[kind || "arrive"];
  if (navigator.vibrate) navigator.vibrate(kind === "test" ? 100 : [300, 120, 300, 120, 300]);
  if (!soundOn()) { checkSound(); return; }
  try {
    pattern.forEach(([freq, at]) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}

// keep the screen on while the page is open, so the phone does not sleep and miss the robot
function keepAwake() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  navigator.wakeLock.request("screen").then(l => {
    wakeLock = l; l.addEventListener("release", () => { wakeLock = null; });
  }).catch(() => {});
}

// coming back to the page: the phone may have muted it and dropped the screen lock
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (audio && audio.state !== "running") audio.resume().catch(() => {}).finally(checkSound);
  if (soundOn()) keepAwake();
  checkSound();
});

// remind every 15 s while the robot waits for this person
function needsMe(r) {
  const mine = current && current.cabin;
  return r && ((r.status === "wait_shipped" && r.sender === mine && !r.shipped) ||
               (r.status === "wait_received" && r.destination === mine && !r.received));
}
setInterval(() => { if (current && Object.values(requests).some(needsMe)) beep("arrive"); }, 15000);

// flash the page (and the tab title) while the robot waits for this person
const TITLE = document.title;
let titleTimer = null;
function updateFlash() {
  const on = !!current && Object.values(requests).some(needsMe);
  document.body.classList.toggle("flash", on);
  if (on && !titleTimer) {
    titleTimer = setInterval(() => {
      document.title = document.title === TITLE ? "🔔 Robot is here!" : TITLE;
    }, 1000);
  } else if (!on && titleTimer) {
    clearInterval(titleTimer); titleTimer = null; document.title = TITLE;
  }
}

// ---------- display ----------
function render() {
  updateFlash();
  if (!current) return;
  const mine = current.cabin, list = $("list");
  const ids = Object.keys(requests).filter(id => {
    const r = requests[id];
    return r && (r.sender === mine || r.destination === mine);
  }).sort().reverse().slice(0, 8);
  list.innerHTML = "";
  if (!ids.length) { list.className = "muted"; list.textContent = "Nothing yet."; return; }
  list.className = "";
  ids.forEach(id => {
    const r = requests[id], card = el("div", "req");
    card.appendChild(el("div", "route", (r.senderName || r.sender) + " → " + (r.receiverName || r.destination)));
    const s = STATUS[r.status] || [r.status, ""];
    card.appendChild(el("span", "chip " + s[1], s[0]));
    if (r.status === "wait_shipped" && r.sender === mine && !r.shipped) {
      card.appendChild(el("div", "alert", "The robot is at your cabin. Put the parcel in the box, then press OK shipped."));
      const b = el("button", "big", "OK shipped"); b.onclick = () => { b.disabled = true; press(id, "shipped"); };
      card.appendChild(b);
    } else if (r.status === "wait_received" && r.destination === mine && !r.received) {
      card.appendChild(el("div", "alert", "The robot has arrived at your cabin. Take the parcel, then press Received."));
      const b = el("button", "big", "Received"); b.onclick = () => { b.disabled = true; press(id, "received"); };
      card.appendChild(b);
    } else if (r.status === "failed" || r.status === "rejected") {
      card.appendChild(el("div", "muted", r.detail || ""));
    } else if (r.status === "delivered") {
      card.appendChild(el("div", "muted", "Parcel delivered."));
    }
    list.appendChild(card);
    // Beep when it is this person's turn (also the first time they see it), and when their parcel is
    // delivered or a delivery fails.
    const key = mine + ":" + id, seen = key in lastStatus;
    const act = (r.status === "wait_shipped" && r.sender === mine) || (r.status === "wait_received" && r.destination === mine);
    const done = (r.status === "delivered" && r.sender === mine) || r.status === "failed";
    if (lastStatus[key] !== r.status && (act || (done && seen))) beep(act ? "arrive" : "done");
    lastStatus[key] = r.status;
  });
}

function renderRobot() {
  const dot = $("dot"), txt = $("robotText");
  const online = robot && robot.heartbeat && (Date.now() + offset - robot.heartbeat) < 20000;
  dot.className = "dot " + (online ? "on" : "off");
  if (!robot) { txt.textContent = "No robot information yet."; return; }
  txt.textContent = online ? (robot.detail || robot.state) : "Robot system is offline.";
}

db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; renderRobot(); });
setInterval(renderRobot, 5000);
</script>
</body>
</html>
